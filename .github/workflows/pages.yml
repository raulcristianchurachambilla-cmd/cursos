name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# IMPORTANTE: cancel-in-progress se deja en false a propósito.
# Si se cancela un despliegue de Pages a la mitad, el sitio puede quedar
# servido desde un estado incompleto -> esto explica el "a veces funciona,
# a veces no". Con false, cada despliegue termina antes de que empiece el
# siguiente, y siempre queda una versión completa y consistente publicada.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar que exista la carpeta de destino
        run: |
          set -euo pipefail
          TARGET_DIR="./FINESI/SEMESTRE_VI"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::La carpeta $TARGET_DIR no existe. Revisa el nombre exacto (Linux distingue mayúsculas/minúsculas y no debe llevar espacios)."
            echo "Contenido actual de ./FINESI:"
            ls -la ./FINESI 2>/dev/null || echo "  (la carpeta FINESI tampoco existe)"
            exit 1
          fi

      - name: Validar que existan archivos .html publicables
        run: |
          set -euo pipefail
          TARGET_DIR="./FINESI/SEMESTRE_VI"
          COUNT=$(find "$TARGET_DIR" -maxdepth 1 -iname "*.html" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No se encontró ningún archivo .html dentro de $TARGET_DIR."
            exit 1
          fi
          echo "Se encontraron $COUNT archivo(s) .html:"
          find "$TARGET_DIR" -maxdepth 1 -iname "*.html" -exec basename {} \;

      - name: Generar index.html de respaldo si no existe
        run: |
          set -euo pipefail
          TARGET_DIR="./FINESI/SEMESTRE_VI"
          if [ ! -f "$TARGET_DIR/index.html" ]; then
            echo "⚠️ No se encontró index.html. Generando uno automático con la lista de archivos..."

            {
              echo '<!DOCTYPE html>'
              echo '<html lang="es">'
              echo '<head>'
              echo '  <meta charset="UTF-8">'
              echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0">'
              echo '  <title>FINESI - SEMESTRE VI</title>'
              echo '  <style>'
              echo '    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: auto; line-height: 1.5; }'
              echo '    h1 { color: #0969da; border-bottom: 2px solid #eaecef; padding-bottom: .3em; }'
              echo '    ul { list-style-type: square; }'
              echo '    a { color: #0969da; text-decoration: none; }'
              echo '    a:hover { text-decoration: underline; }'
              echo '  </style>'
              echo '</head>'
              echo '<body>'
              echo '  <h1>FINESI / SEMESTRE VI</h1>'
              echo '  <p>El sitio se ha desplegado correctamente. Archivos disponibles:</p>'
              echo '  <ul>'
              for file in "$TARGET_DIR"/*.html; do
                filename=$(basename "$file")
                echo "    <li><a href=\"$filename\">$filename</a></li>"
              done
              echo '  </ul>'
              echo '</body>'
              echo '</html>'
            } > "$TARGET_DIR/index.html"
          fi

      - name: Verificar que index.html no esté vacío
        run: |
          set -euo pipefail
          TARGET_DIR="./FINESI/SEMESTRE_VI"
          if [ ! -s "$TARGET_DIR/index.html" ]; then
            echo "::error::index.html existe pero está vacío (0 bytes)."
            exit 1
          fi

      - name: Listar contenido final a publicar (para depurar en los logs)
        run: |
          TARGET_DIR="./FINESI/SEMESTRE_VI"
          echo "Archivos que se van a publicar:"
          ls -la "$TARGET_DIR"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './FINESI/SEMESTRE_VI'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
